name: Proposta di funzionalità
description: Proponi una capacità collegata a una necessità verificabile.
title: "feat: "
labels:
  - type:feature
  - status:triage
body:
  - type: textarea
    id: necessita
    attributes:
      label: Necessità
      description: Quale problema dell'utente deve essere risolto?
    validations:
      required: true
  - type: textarea
    id: risultato
    attributes:
      label: Risultato desiderato
      description: Descrivi l'esito osservabile, non soltanto una tecnologia.
    validations:
      required: true
  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione
      description: Elenca condizioni misurabili e verificabili.
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternative considerate
      description: Includi il comportamento attuale e la possibilità di non intervenire.
  - type: checkboxes
    id: impatti
    attributes:
      label: Impatti da valutare
      options:
        - label: Ho considerato macOS e iPadOS.
        - label: Ho considerato accessibilità, italiano iniziale e localizzazione futura.
        - label: Ho considerato privacy, sicurezza, prestazioni ed energia.
