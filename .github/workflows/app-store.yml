name: App Store preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-store-baseline:
    name: app-store-baseline
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Acquisizione sorgenti
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Preflight App Store
        run: ./Scripts/verify-app-store.sh
