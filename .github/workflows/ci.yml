# SPDX-License-Identifier: BSD-3-Clause

name: Verifica

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Acquisizione sorgenti
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Quality gate completo
        run: ./Scripts/verify.sh
